name: Backend source checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".env.example"
      - ".gitignore"

jobs:
  safety-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check repository safety
        run: python backend/scripts/check_repo_safety.py
      - name: Install lightweight test dependencies
        run: python -m pip install pytest numpy pillow
      - name: Run backend tests that do not require model weights
        run: python -m pytest backend/tests backend/agents/agent1/tests backend/agents/agent2/tests
