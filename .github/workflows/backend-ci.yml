name: Backend source checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".env.example"
      - ".gitignore"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".env.example"
      - ".gitignore"

jobs:
  safety-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check repository safety
        run: python backend/scripts/check_repo_safety.py
      - name: Install lightweight test dependencies
        if: ${{ hashFiles('backend/**/test_*.py') != '' }}
        run: |
          python -m pip install pytest numpy scipy pillow opencv-python-headless
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run backend tests that do not require model weights
        if: ${{ hashFiles('backend/**/test_*.py') != '' }}
        run: python -m pytest backend
      - name: Note that this staged branch has no backend tests yet
        if: ${{ hashFiles('backend/**/test_*.py') == '' }}
        run: echo "No backend tests are present in this staged branch; safety checks passed."
